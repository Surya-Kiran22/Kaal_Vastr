# Production Nginx Load Balancer Configuration
# High-concurrency cluster configuration designed to handle 200+ simultaneous logins without downtime.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Tuning & Connection Keepalive
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Rate Limiting Zone: Prevents server crash during 200+ member login spikes
    # Allows 200 requests/sec with a burst buffer of 50
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Load Balancer Upstream Cluster (Round-Robin / Least-Connections strategy)
    upstream kaalvastr_backend_cluster {
        least_conn; # Routes traffic to server with fewest active connections
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        keepalive 64; # Maintain persistent connection pool
    }

    server {
        listen 80;
        listen [::]:80;
        server_name kaal-vastr-ecommerce.onrender.com;

        # Gzip Compression
        gzip on;
        gzip_comp_level 5;
        gzip_types text/plain text/css application/json application/javascript text/xml;

        location / {
            proxy_pass http://kaalvastr_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Apply Rate Limiting & High Concurrency Buffer
            limit_req zone=auth_limit burst=50 nodelay;
            limit_conn addr_limit 100;
        }

        # Static Assets Caching Optimization
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
}
